name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Evidence site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check evidence site
        run: pnpm typecheck

      - name: Build and assert static deployment
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Check patch whitespace
        run: git diff --check

      - name: Test
        # Phases 0-8 make zero API calls by design, so CI needs no secrets.
        run: pytest -q

      # Determinism gate. Content-addressed IDs must not depend on dict or set iteration
      # order; a regression here would silently break cross-machine reproducibility of the
      # published evidence bundle, which is the project's central integrity claim.
      - name: Assert hash stability across PYTHONHASHSEED
        run: |
          a=$(PYTHONHASHSEED=0 python -c "from credit_audit.ids import content_id; print(content_id({'b':[3,1,2],'a':{'z':1,'y':2}}))")
          b=$(PYTHONHASHSEED=12345 python -c "from credit_audit.ids import content_id; print(content_id({'b':[3,1,2],'a':{'z':1,'y':2}}))")
          test "$a" = "$b" || { echo "content_id varies with PYTHONHASHSEED: $a vs $b"; exit 1; }
          echo "stable: $a"

      # The Phase 8 exit criterion, run against the real entry point rather than in-process:
      # a run, two exports into separate directories, a literal `diff -r`, and a strict verify
      # that re-derives every published statistic from the raw JSONL. This is the claim a
      # stranger is invited to check, so CI checks it the same way they would.
      - name: Export determinism and verification gate
        run: |
          credit-audit run --suite smoke --model scripted --seed 1729 --runs-dir "$RUNNER_TEMP/runs"
          RUN_ID=$(ls "$RUNNER_TEMP/runs")
          credit-audit export --run "$RUN_ID" --runs-dir "$RUNNER_TEMP/runs" --out "$RUNNER_TEMP/a"
          credit-audit export --run "$RUN_ID" --runs-dir "$RUNNER_TEMP/runs" --out "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a/$RUN_ID" "$RUNNER_TEMP/b/$RUN_ID"
          credit-audit verify --run "$RUN_ID" --runs-dir "$RUNNER_TEMP/runs" --out "$RUNNER_TEMP/a" --strict
