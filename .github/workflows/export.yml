name: Export and Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Fresh scripted run and sweep
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          credit-audit run --suite core --model scripted --runs-dir "$RUNNER_TEMP/runs"
          credit-audit sweep --runs-dir "$RUNNER_TEMP/runs"

      - name: Re-export bundles
        run: |
          for RUN_ID in $(ls "$RUNNER_TEMP/runs"); do
            credit-audit export --run "$RUN_ID" --runs-dir "$RUNNER_TEMP/runs" --out web/public/runs/ --allow-commit-drift
          done

      - name: Assert no stale data (git diff)
        run: git diff --exit-code web/public/runs/

      - name: Verify bundles strictly
        run: |
          for RUN_ID in $(ls "$RUNNER_TEMP/runs"); do
            credit-audit verify --run "$RUN_ID" --runs-dir "$RUNNER_TEMP/runs" --out web/public/runs/ --strict
          done

      - name: Type-check and assert static boundaries
        working-directory: web
        run: pnpm check
