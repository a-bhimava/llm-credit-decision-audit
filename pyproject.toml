[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-credit-decision-audit"
version = "0.1.0.dev0"
description = "Audit harness that tests whether an LLM underwriting agent's stated adverse-action reasons are the reasons it actually acted on."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Teja Bhimavarapu" }]
keywords = [
    "llm-evaluation", "agent-evaluation", "fairness-testing", "metamorphic-testing",
    "model-risk-management", "fair-lending", "credit-risk", "responsible-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.21",
    "ruff>=0.6",
]
# Native Gemini adapter (Phase 9). The OpenAI-compatible adapter needs no extra dep.
gemini = ["google-genai>=2.17"]

[project.scripts]
credit-audit = "credit_audit.cli:app"

[project.urls]
Homepage = "https://github.com/a-bhimava/llm-credit-decision-audit"
Repository = "https://github.com/a-bhimava/llm-credit-decision-audit"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running statistical calibration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
