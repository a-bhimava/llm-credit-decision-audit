[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-credit-decision-audit"
version = "0.1.0.dev0"
description = "Audit harness that tests whether an LLM underwriting agent's stated adverse-action reasons are the reasons it actually acted on."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Teja Bhimavarapu" }]
keywords = [
    "llm-evaluation", "agent-evaluation", "fairness-testing", "metamorphic-testing",
    "model-risk-management", "fair-lending", "credit-risk", "responsible-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9",
    # numpy/scipy are pinned to a narrow minor-version range, not left open like the rest
    # of these: profiles/fixtures/profiles.jsonl's byte-identical regeneration depends on
    # numpy.random.Generator (guaranteed stream-stable across versions) AND
    # scipy.stats.norm.ppf/.cdf (creditfile.py's FICO calibration -- scipy makes no
    # equivalent cross-version bit-stability guarantee). This bounds future silent drift;
    # it does not retroactively prove the exact versions below are bit-stable across every
    # Python version in CI's matrix, which would need an actual CI run to confirm.
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # HTTP-level record/replay, for asserting our wire format against a real provider's bytes.
    # Protocol-level cassettes are ours; see src/credit_audit/model/cassette.py for why.
    "vcrpy>=6.0",
    "pytest-recording>=0.13",
]
# Provider adapters are optional: scripted runs and cassette replay need neither.
providers = ["openai>=1.0"]
# Native Gemini adapter, for cache telemetry the compat endpoint does not expose.
gemini = ["google-genai>=2.17"]

[project.scripts]
credit-audit = "credit_audit.cli:main"

[project.urls]
Homepage = "https://github.com/a-bhimava/llm-credit-decision-audit"
Repository = "https://github.com/a-bhimava/llm-credit-decision-audit"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running statistical calibration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
