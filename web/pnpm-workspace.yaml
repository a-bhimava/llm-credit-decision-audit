allowBuilds:
  # These packages work from their shipped artifacts. Pinning them to false keeps pnpm's
  # install reproducible and non-interactive in CI rather than asking a deploy to approve code.
  '@google/genai': false
  '@swc/core': false
  cbor-extract: false
  esbuild: false
  protobufjs: false
  # This static site does not use Next image optimization. Keep Sharp's optional
  # native install script disabled so local and CI installs are non-interactive.
  sharp: false
